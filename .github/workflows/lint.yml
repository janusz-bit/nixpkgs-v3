# Formatting and lints (nixfmt, statix, deadnix, actionlint) plus the CI tools
# build (flake8 on v3ci.py). Cheap, no secrets, also for pull requests.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix build -L .#checks.x86_64-linux.lint .#checks.x86_64-linux.v3ci .#checks.x86_64-linux.isa-scan
