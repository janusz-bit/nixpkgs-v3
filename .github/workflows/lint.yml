# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
      - name: Lint and build the CI tools
        run: nix build -L .#checks.x86_64-linux.pre-commit .#checks.x86_64-linux.v3ci .#checks.x86_64-linux.isa-scan .#checks.x86_64-linux.ci-plan .#checks.x86_64-linux.ci-state .#checks.x86_64-linux.ci-rpi-push
    timeout-minutes: 30
name: lint
"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
