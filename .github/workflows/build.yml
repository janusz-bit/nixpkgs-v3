# World build: the laptop of janusz-bit/nixos (nixosConfigurations.nixos with
# its own flake.lock) on x86-64-v3, fanned out over free runners and pushed to
# cachix.
#
# plan      evaluates the target, dry-runs it against the caches and
#           list-schedules what is missing over up to `machines` runners
#           (tools/v3ci.py plan). Nothing missing: marker publishes
#           tag cached/nixos-<rev> and ci-state:status.json.
# build     one job per runner: builds its share, waits for inputs from other
#           runners in cachix, stops before the 6 h job limit.
# finalize  records measured build times on branch ci-state, writes the
#           summary and dispatches the next run while progress is made.
#
# Without CACHIX_AUTH_TOKEN everything still runs, on one runner with a short
# budget and without push or re-dispatch. Never runs for pull requests: the
# jobs hold the cachix token.
name: build

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - module.nix
      - lib/**
      - overlay/**
      - tools/**
      - ci/**
      - .github/workflows/build.yml
  schedule:
    # Polls janusz-bit/nixos master; a run for an already cached revision
    # stops after the plan.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      nixos_ref:
        description: "janusz-bit/nixos branch, tag or commit"
        default: master
      machines:
        description: "Runners for this run (free plan: 20 concurrent jobs)"
        default: "16"
      chain:
        description: "Re-dispatch counter (set by finalize)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: world-build
  cancel-in-progress: false

env:
  NIXOS_REPO: janusz-bit/nixos
  CACHE_NAME: janusz-bit
  CACHE_URL: https://janusz-bit.cachix.org
  MAX_CHAIN: "40"
  # Cheap intermediates (source copies, vendored crates): never pushed
  # (cachix pushFilter) and rebuilt by whichever runner needs them.
  LOCAL_ONLY: "(-src|-vendor|-source)(-[0-9][^-]*)?$"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      real: ${{ steps.plan.outputs.real }}
      nixos_rev: ${{ steps.rev.outputs.nixos_rev }}
      drv: ${{ steps.eval.outputs.drv }}
      push: ${{ steps.secret.outputs.push }}
      capped: ${{ steps.plan.outputs.capped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: secret
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: if [ -n "$CACHIX_AUTH_TOKEN" ]; then echo push=true; else echo push=false; fi >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ env.CACHE_URL }}
            extra-trusted-public-keys = janusz-bit.cachix.org-1:4stTiufAF02BAXw8HNvYslAmUlPbZPIRhIGht0gSMoo=
            extra-system-features = gccarch-x86-64 gccarch-x86-64-v2 gccarch-x86-64-v3
            narinfo-cache-negative-ttl = 0
      - id: rev
        run: |
          ref=${{ inputs.nixos_ref || 'master' }}
          rev=$(git ls-remote "https://github.com/$NIXOS_REPO" "$ref" "refs/heads/$ref" | head -1 | cut -f1)
          [ -n "$rev" ] || rev=$ref
          echo "nixos_rev=$rev" >> "$GITHUB_OUTPUT"
          echo "Target: $NIXOS_REPO@$rev, nixpkgs-v3@$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - id: eval
        run: |
          drv=$(nix eval --raw ./ci#v3.drvPath --override-input nixos "github:$NIXOS_REPO/${{ steps.rev.outputs.nixos_rev }}")
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
      - name: Fetch measured build times
        run: git fetch --depth=1 origin ci-state && git show FETCH_HEAD:build-times.json > build-times.json || echo '{}' > build-times.json
      - id: plan
        run: |
          if [ "${{ steps.secret.outputs.push }}" = true ]; then machines=${{ inputs.machines || '16' }}; budget=18900; else machines=1; budget=7200; fi
          generic=$(nix eval --raw ./ci#generic.drvPath --override-input nixos "github:$NIXOS_REPO/${{ steps.rev.outputs.nixos_rev }}" 2>/dev/null || true)
          nix run .#v3ci -- plan --drv "${{ steps.eval.outputs.drv }}" --cache "$CACHE_URL" \
            --machines "$machines" --budget "$budget" --times build-times.json --out plan.json \
            --quota-gb "${{ vars.CACHIX_QUOTA_GB || '5' }}" --local-only "$LOCAL_ONLY" ${generic:+--generic "$generic"} > plan-out.json
          {
            echo "matrix=$(jq -c .matrix plan-out.json)"
            echo "real=$(jq .real plan-out.json)"
            echo "capped=$(jq .capped plan-out.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plan
          path: plan.json
          retention-days: 7

  marker:
    needs: plan
    if: needs.plan.outputs.real == '0' && needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Publish fully-cached marker
        run: |
          rev=${{ needs.plan.outputs.nixos_rev }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="cached/nixos-$rev"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "every non-trivial path of $NIXOS_REPO@$rev (x86-64-v3) is in $CACHE_URL" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if git fetch origin ci-state; then git checkout -B ci-state FETCH_HEAD; else git checkout --orphan ci-state && git rm -rqf --cached .; fi
          jq -n --arg rev "$rev" --arg v3 "$GITHUB_SHA" --arg drv "${{ needs.plan.outputs.drv }}" \
            '{cached: {nixos_rev: $rev, nixpkgs_v3_rev: $v3, toplevel_drv: $drv, at: (now | todate)}}' > status.json
          git add status.json && git commit -qm "ci-state: $NIXOS_REPO@$rev fully cached" && git push origin ci-state
          echo "Fully cached: $NIXOS_REPO@$rev, tag $tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Runner CPU must run x86-64-v3 code
        run: |
          grep -m1 'model name' /proc/cpuinfo | tee -a "$GITHUB_STEP_SUMMARY"
          for f in avx2 bmi1 bmi2 fma movbe abm f16c; do grep -qw "$f" /proc/cpuinfo || { echo "::error::CPU lacks $f"; exit 1; }; done
          /lib64/ld-linux-x86-64.so.2 --help | grep -q 'x86-64-v3 (supported' || { echo "::error::glibc says no x86-64-v3"; exit 1; }
      - name: Reclaim disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup &
          sudo docker image prune --all --force >/dev/null 2>&1 &
          # /mnt is the larger temporary disk; /nix and the build directory go there.
          sudo mkdir -p /mnt/nix /nix && sudo mount --bind /mnt/nix /nix
          wait
          df -h / /mnt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ env.CACHE_URL }}
            extra-trusted-public-keys = janusz-bit.cachix.org-1:4stTiufAF02BAXw8HNvYslAmUlPbZPIRhIGht0gSMoo=
            extra-system-features = gccarch-x86-64 gccarch-x86-64-v2 gccarch-x86-64-v3
            narinfo-cache-negative-ttl = 0
            build-dir = /nix/var/nix/builds
            max-silent-time = 3600
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ needs.plan.outputs.push != 'true' }}
          pushFilter: ${{ env.LOCAL_ONLY }}
      - name: Evaluate the same target
        run: |
          drv=$(nix eval --raw ./ci#v3.drvPath --override-input nixos "github:$NIXOS_REPO/${{ needs.plan.outputs.nixos_rev }}")
          [ "$drv" = "${{ needs.plan.outputs.drv }}" ] || { echo "::error::evaluated $drv, plan has ${{ needs.plan.outputs.drv }}"; exit 1; }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: plan
      - name: Build share ${{ matrix.machine }}
        run: |
          nix build .#v3ci --out-link v3ci
          # 5 h 15 min from here (setup took about 10 min) leaves time for the
          # cachix daemon to finish pushing before the 6 h job limit.
          deadline=$(( $(date +%s) + 18900 ))
          ./v3ci/bin/v3ci execute --plan plan.json --machine ${{ matrix.machine }} --deadline "$deadline" \
            --jobs 2 --cores 4 \
            ${{ needs.plan.outputs.push == 'true' && '--remote' || '--no-remote' }} \
            --logs logs --results results-${{ matrix.machine }}.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.machine }}
          path: |
            results-${{ matrix.machine }}.json
            logs/
          retention-days: 14
          if-no-files-found: ignore

  finalize:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.6/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - id: fin
        run: |
          nix build .#v3ci --out-link v3ci
          git fetch origin ci-state && git show FETCH_HEAD:build-times.json > build-times.json || echo '{}' > build-times.json
          ./v3ci/bin/v3ci finalize --plan artifacts/plan/plan.json --times build-times.json \
            artifacts/results-*/results-*.json > status.json
          echo "built=$(jq .built status.json)" >> "$GITHUB_OUTPUT"
      - name: Record build times on ci-state
        if: needs.plan.outputs.push == 'true'
        run: |
          cp build-times.json status.json "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin ci-state; then git checkout -B ci-state FETCH_HEAD; else git checkout --orphan ci-state && git rm -rqf --cached .; fi
          cp "$RUNNER_TEMP/build-times.json" build-times.json
          jq --arg rev "${{ needs.plan.outputs.nixos_rev }}" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.last = (input | . + {nixos_rev: $rev, run: $run})' \
            <(git show HEAD:status.json 2>/dev/null || echo '{}') "$RUNNER_TEMP/status.json" > status.json
          git add build-times.json status.json
          git commit -qm "ci-state: build times of run $GITHUB_RUN_ID" && git push origin ci-state
      - name: Dispatch the next run
        if: needs.plan.outputs.push == 'true' && needs.plan.outputs.capped != 'true' && steps.fin.outputs.built != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chain=$(( ${{ inputs.chain || '0' }} + 1 ))
          if [ "$chain" -gt "$MAX_CHAIN" ]; then echo "chain limit $MAX_CHAIN reached" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f nixos_ref="${{ needs.plan.outputs.nixos_rev }}" \
            -f machines="${{ inputs.machines || '16' }}" -f chain="$chain"
          echo "Dispatched run $chain of the chain" >> "$GITHUB_STEP_SUMMARY"
