        description: Re-dispatch counter (set by finalize)
        required: false
      machines:
        default: "16"
        description: Runners for this run (at most 16)
        required: false
      nixos_ref:
        default: master
        description: janusz-bit/nixos branch, tag or commit
        required: false
permissions:
  contents: read
